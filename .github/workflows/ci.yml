name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: harehare/setup-mq@v1.1.6
        with:
          bins: test
      - name: Run tests
        run: |
          mq-test -L vendor/ds.mq -L . simhash_tests.mq
          mq-test -L vendor/ds.mq -L . minhash_tests.mq
